[workspace]
resolver = "2"

members = [
    "crates/*",
]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Prabir Shrestha <mail@prabir.me>"]
repository = "https://github.com/prabirshrestha/ai.rs"

[workspace.dependencies]
ai = { path = "crates/ai" }
async-stream = "0.3.6"
async-trait = "0.1.85"
base64 = "0.23.0"
dyn-clone = "1.0.17"
futures = "0.3.31"
httpdate = "1.0.3"
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12.5"
reqwest = { version = "0.13.0", features = ["json", "rustls", "stream"], default-features = false }
regex = "1.11.1"
ring = "0.17.14"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.135", features = ["preserve_order"] }
thiserror = "2.0.9"
tokio = { version = "1.43.0", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.13"
