[workspace]
resolver = "2"

members = [
    "crates/*",
    "examples/*",
]

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Prabir Shrestha <mail@prabir.me>"]
repository = "https://github.com/prabirshrestha/ai.rs"

[workspace.dependencies]
ai = { path = "crates/ai" }
async-stream = "0.3.6"
async-trait = "0.1.85"
base64 = "0.23.0"
bytes = "1"
dyn-clone = "1.0.17"
futures = "0.3.31"
httpdate = "1.0.3"
indexmap = { version = "2.7.0", features = ["serde"] }
parking_lot = "0.13.0"
reqwest = { version = "0.13.0", features = ["json", "rustls", "stream"], default-features = false }
regex = "1.11.1"
ring = "0.17.14"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.135", features = ["preserve_order"] }
thiserror = "2.0.9"
tokio = { version = "1.43.0", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.13"

# fx's core (`harness-fx`) is compiled by Cranelift when it starts. Built
# unoptimized, Cranelift takes about half a minute for it in debug builds and
# tests; optimized, a few seconds.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.dev.package.wasmtime-environ]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

[profile.dev.package.cranelift-assembler-x64]
opt-level = 3

[profile.dev.package.cranelift-entity]
opt-level = 3

[profile.dev.package.cranelift-bforest]
opt-level = 3
