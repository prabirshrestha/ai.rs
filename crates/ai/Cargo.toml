[package]
name = "ai"
version = "0.8.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Simple to use LLM library for Rust with streaming, tool calling, OAuth helpers, and a lightweight agent loop"
repository.workspace = true
readme = "README.md"

[features]
default = ["durable", "durable-local-env"]
# Pi Durable and the chord subset it uses (`chord`, `durable`); `similar` and
# `unicode-normalization` back the coding tools' edit diff and fuzzy matching.
durable = ["dep:similar", "dep:unicode-normalization"]
# Reusable durable storage conformance suite (`durable::testing`).
durable-testing = ["durable"]
# `SqliteStorage` over a bundled SQLite (`durable::storage::sqlite::rusqlite`).
durable-sqlite = ["durable", "dep:rusqlite"]
# `LocalExecutionEnv` and the local JSONL storage adapter (`durable::env::local`).
durable-local-env = ["durable", "tokio/fs", "tokio/process", "dep:libc"]

[dependencies]
async-trait.workspace = true
async-stream.workspace = true
base64.workspace = true
dyn-clone.workspace = true
futures.workspace = true
httpdate.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
regex.workspace = true
ring.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
similar = { version = "3", optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
unicode-normalization = { version = "0.1.25", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "net"] }
