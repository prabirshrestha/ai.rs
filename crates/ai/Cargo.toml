[package]
name = "ai"
version = "0.10.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Simple to use LLM library for Rust with streaming, tool calling, OAuth helpers, and a lightweight agent loop"
repository.workspace = true
readme = "README.md"

[dependencies]
async-trait.workspace = true
async-stream.workspace = true
base64.workspace = true
bytes.workspace = true
dyn-clone.workspace = true
futures.workspace = true
httpdate.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
regex.workspace = true
ring.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
wasmtime = { version = "50.0.3", optional = true, default-features = false, features = ["async", "cranelift", "runtime", "std", "parallel-compilation"] }
flate2 = { version = "1.0.35", optional = true }
tar = { version = "0.4.43", optional = true }

[features]
default = [
    "harness",
    "harness-native",
    "harness-pi",
    "harness-claude-code",
    "harness-codex",
    "harness-acp",
    "harness-cursor",
    "harness-github-copilot",
    "harness-opencode",
]
# Agent harnesses: agents that run their own loop inside a sandbox.
harness = ["tokio/process"]
# Harness adapters. All but fx are on by default.
harness-native = ["harness"]
harness-pi = ["harness"]
harness-claude-code = ["harness"]
harness-codex = ["harness"]
harness-acp = ["harness", "tokio/net"]
harness-cursor = ["harness-acp"]
harness-github-copilot = ["harness-acp"]
harness-opencode = ["harness", "tokio/net"]
# fx runs its core, a WebAssembly module, on wasmtime.
harness-fx = ["harness", "dep:wasmtime", "dep:flate2", "dep:tar"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
