[package]
name = "ai"
version = "0.10.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Simple to use LLM library for Rust with streaming, tool calling, OAuth helpers, and a lightweight agent loop"
repository.workspace = true
readme = "README.md"

[dependencies]
async-trait.workspace = true
async-stream.workspace = true
base64.workspace = true
bytes.workspace = true
dyn-clone.workspace = true
futures.workspace = true
httpdate.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
regex.workspace = true
ring.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite = { workspace = true, optional = true }

[features]
default = ["harness"]
# Port of the Vercel AI SDK harness (`@ai-sdk/harness`).
harness = ["tokio/process", "tokio/net", "dep:tokio-tungstenite"]
# Harness adapters (`@ai-sdk/harness-*`), each opt-in.
harness-acp = ["harness"]
harness-cursor = ["harness-acp"]
harness-github-copilot = ["harness-acp"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
